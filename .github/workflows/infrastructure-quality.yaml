name: Infrastructure quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-format:
    name: Terraform format
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff infra

  terraform-validate:
    name: Terraform validate (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/bootstrap
          - infra/shared
          - infra/environments/dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Initialize without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false -no-color

      - name: Validate configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Initialize plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Lint Terraform
        run: >
          tflint
          --recursive
          --config "$GITHUB_WORKSPACE/.tflint.hcl"
          --format compact

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          version: v0.11.0
          severity: warning
          check_together: "true"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  trivy:
    name: Trivy IaC
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: infra
          format: table
          hide-progress: true
          severity: CRITICAL
          exit-code: "1"
